<!-- Include Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
    .desktop{
        display: block;
    }
    .mobile{
        display: none;
    }
    .custom-title{
        font-size: 19px;
        text-align: center;
    }
    .custom-hr{
        position: relative;
        border: 2px solid #d9d9d9;
        margin-right: 9px; 
    }
    .custom-line{
        position: absolute;
        width: 309px;
        height: 4px;
        background: #a98153;
        margin-top: -24px !important;
        margin: auto;
        left: 50%;
        transform: translateX(-50%);
    }
    .margin-bottom{
        margin-bottom: 8px;
    }
    @media screen and (max-width: 767px){
        .desktop{
            display: none;
        }
        .mobile{
            display: block;
        }
        .custom-hr{
            margin-right: 0;
        }
        .custom-title {
            font-size: 13px;
            font-weight: bold;
        }
        .custom-line{
           width: 100px;
            
        }
        .swiper-slide img {
          width: 100%;
          height: auto;
          display: block;
        }
        

    }
</style>

<!-- Include Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
$(document).ready(function(){
    var swiper = new Swiper(".mySwiper", {
        spaceBetween: 10,
        speed: 3000,
        lazy: true, 
        slidesPerView: 1, 
        grid: { rows: 2 }, 
        autoplay: {
            delay: 5000,
            disableOnInteraction: false,
        },
        loop: true,
        allowTouchMove: true, 
        navigation: false,
        breakpoints: {
            1499: { slidesPerView: 4, grid: { rows: 2 } },
            1199: { slidesPerView: 3, grid: { rows: 2 } },
            991: { slidesPerView: 3, grid: { rows: 2 } },
            767: { slidesPerView: 3, grid: { rows: 2 } },
            567: { slidesPerView: 2, grid: { rows: 2 } },
            359: { slidesPerView: 2, grid: { rows: 1 } },
        },
    });
});

</script>
