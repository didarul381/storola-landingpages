<style>
/* Container to hide overflow */
.banner-card1 {
    display: block;
    overflow: hidden; /* ensures image doesn't overflow container */
    border-radius: 5px; /* optional, same as your grid style */
    margin-top: 10px;
    margin-bottom: 10px;
}

/* Image styles */
.banner-card-img1 {
    margin-top: 20px;
    width: 100%;
    display: block;
    transition: transform 0.3s ease; /* smooth animation */
    object-fit: cover; /* maintain aspect ratio */
}

/* Scale image on hover of parent */
.banner-card1:hover .banner-card-img1 {
    transform: scale(1.1); /* scale 10% */
}
</style>

<div class="row">
    <a href="#" class="banner-card1" style="width: 100%; padding: 0;">
        <img src="image/catalog/ptblock/pond.jpeg" alt="img1" class="banner-card-img1">
    </a>
</div>
