<style>
    .three-banner-items {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

}
.three-banner-item {

}
.banner-card-img-wrap {
    position: relative;
    overflow: hidden;
    display: flex;
}
.banner-card-img-wrap::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, .3);
    pointer-events: none;
    z-index: 1;
}
.banner-card-img {
    transition: 
ease .3s;
    max-height: 220px;
    width: 100%;
    object-fit: cover;
    position: relative;
    display: block;
}
.banner-card:hover .banner-card-img {
    transform: scale(1.1);
}
.banner-content-wrapper {
    position: absolute;
    bottom: 10px;
    left: 20px;
    color: #fff;
    z-index: 2;
}
.banner-content-wrapper .banner-card-heading {
    font-size: 22px;
    margin: 0;

    color: #fff;
    text-transform: uppercase;

}
.animated-btn {

    padding: 10px 40px;
    transition: 
ease .3s;
    font-family:"Poppins", sans-serif;
    text-transform: uppercase;
    color: rgb(0,0,0);
    position: relative;
    overflow: hidden;
    border: 1px solid rgb(0,0,0);
    text-align: center;
    display: inline-block;
    z-index: 1;
    border-radius: 8px;
}
.animated-btn span {
    position: absolute;
    display: block;
    width: 0;
    height: 0;
    border-radius: 50%;
    background-color: rgb(1,105,56);
    transition: width .4s 
ease-in-out, height .4s 
ease-in-out;
    transform: translate(-50%, -50%);
    z-index: -1;
}
.animated-btn:hover {
    color: #fff;
}
.animated-btn:hover span {
    width: 225%;
    height: 562.5px;
}
 @media screen and (max-width: 767px){

    }
    .banner-content-wrapper .banner-card-heading {
       font-size: 14px;
       margin: 0;
       margin-bottom: 12px;
    }
    .banner-content-wrapper {
       bottom: 6px;
       left: 12px;
    }
 }
