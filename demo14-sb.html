<!-- Include Swiper CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>
    .desktop {
        display: block;
    }
    .mobile {
        display: none;
    }
    .custom-title {
        font-size: 19px;

        font-weight: 400;
    }
    .custom-hr {
        position: relative;
        border: 2px solid #d9d9d9;
        margin-right: 9px;
    }
    .custom-line {
        position: absolute;
        width: 309px;
        height: 4px;
        background: #a98153;
        margin-top: -15px !important;
        margin: auto;
        left: 50%;
        transform: translateX(-50%);
    }
    .margin-bottom {
        margin-bottom: 8px;
    }

    @media screen and (max-width: 767px) {
        .desktop {
            display: none;
        }
        .mobile {
            display: block;
        }
        .custom-hr {
            margin-right: 0;
        }
        .custom-title {
            font-size: 14px;
            font-weight: bold;
        }
        .custom-line {
            width: 100px;
        }
        .swiper-slide img {
            width: 100%;
            height: auto;
            display: block;
        }
    }
</style>

<!-- Include Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    new Swiper(".mySwiper", {
        slidesPerView: 2,
        spaceBetween: 10,
        loop: true,
        autoplay: {
            delay: 3000,
            disableOnInteraction: false,
        },
        speed: 1000,
        allowTouchMove: true,
    });
});
</script>
