<style>
.business-category {
  display: grid;
  grid-template-columns: 1fr 1fr; /* Two columns: left & right */
  gap: 12px;
}

.left-image {
  position: relative;
  overflow: hidden;
}

.right-grid {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
  gap: 12px;
}

.image-box {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.image-box:hover img {
  transform: scale(1.05);
}



/* Responsive Design */
@media (max-width: 768px) {
  .business-category {
    grid-template-columns: 1fr; /* Stack vertically */
  }

  .right-grid {
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }

}
</style>

<section>
    <div class="business-category">
      <!-- Left Large Image -->
      <div class="left-image image-box">
        <a href="#">
          <img src="image/catalog/ptblock/wd.png" alt="Executive Desks">
        </a>
      </div>
    
      <!-- Right 4-Image Grid -->
      <div class="right-grid">
        <div class="image-box">
          <a href="#">
            <img src="image/catalog/ptblock/ss.png" alt="Business Storage">
          </a>
        </div>
        <div class="image-box">
          <a href="#">
            <img src="image/catalog/ptblock/ww.png" alt="Office Chairs">
          </a>
        </div>
      </div>
    </div>

</section>
